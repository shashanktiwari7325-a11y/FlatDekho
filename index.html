<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlatDekho</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); margin:0; padding:0; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; overflow-x:hidden; padding-top:30px; }
  .container { max-width:900px; margin:40px auto; background:white; padding:30px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.15); position:relative; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
  .logo { display:flex; flex-direction:column; }
  .logo h1 { margin:0; font-size:24px; display:flex; align-items:center; gap:8px; }
  .logo p { margin:0; font-size:14px; color:#555; }
  .madeby { font-size:13px; color:#333; }
  input, button {
  width:100%;
  padding:14px;
  margin:14px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
  transition: all 0.3s ease;
}

  input:focus { border-color:#2563eb; box-shadow:0 0 5px rgba(37,99,235,0.5); outline:none; }
  button { background:linear-gradient(135deg,#2563eb,#1d4ed8); color:white; cursor:pointer; border:none; position:relative; overflow:hidden; }
  button:hover { transform:translateY(-2px); box-shadow:0 4px 10px rgba(37,99,235,0.3); }
  button::before { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition:left 0.5s;}
  button:hover::before { left:100%; }
  .hidden { display:none; }
  .flat-card { border:1px solid #ddd; padding:15px; margin:10px 0; border-radius:8px; background:#f9f9f9; transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .flat-card:hover { transform:translateY(-5px); box-shadow:0 4px 15px rgba(0,0,0,0.1); }
  .flat-card img { width:100%; height:auto; border-radius:8px; margin-bottom:10px; }
  .interested-users { margin-top:10px; padding:10px; background:#e0f7fa; border-radius:5px; }
  .interested-users p { margin:10px 0 22px; }
 .login-container{
  width:1000px;
  max-width:95%;
  height:650px;
  display:flex;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 30px 60px rgba(0,0,0,0.35);
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(14px);
}
.auth-left{
  width:45%;
  padding:50px 40px;
  background:rgba(255,255,255,0.9);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.auth-right{
  width:55%;
}

.auth-right img{
  width:100%;
  height:100%;
  object-fit:cover;
}

  .success-message { color:#22c55e; text-align:center; margin-top:10px; }
  .error-message { color:#dc2626; text-align:center; margin-top:10px; }
  .tabs button{
  width:auto;
  padding:10px 18px;
  font-size:14px;
  border-radius:8px;
}
#searchPage {
  width: 100%;
}

</style>
  <!-- Firebase App (core SDK) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<!-- Firebase Authentication -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>


  
</head>
<body>

<!-- Login Page -->
<div class="login-container" id="loginPage">

  <!-- LEFT FORM -->
  <div class="auth-left">

    <div class="header">
      <div class="logo">
        <h1><i class="fas fa-home"></i> FlatDekho</h1>
        <p>Find a flat buddy, split the rent</p>
      </div>
      <div class="madeby">Made by Shashank Tiwari</div>
    </div>

    <div class="tabs" style="display:flex; gap:10px; margin-bottom:25px;">
      <button id="signInTab" onclick="showSignIn()">Sign In</button>
      <button id="signUpTab" onclick="showSignUp()">Sign Up</button>
    </div>

    <h2>Login</h2>

    <div id="signinForm">
      <input type="email" id="loginEmail" placeholder="Enter Gmail" />
      <input type="password" id="loginPassword" placeholder="Enter Password" />
      <button onclick="signIn()">Sign In</button>

      <p style="text-align:center;">
        <a href="#" onclick="forgotPassword()" style="font-size:14px;">
          Forgot Password?
        </a>
      </p>
    </div>

    <div id="signupForm" class="hidden">
      <input type="text" id="name" placeholder="Full Name" />
      <input type="text" id="phone" placeholder="WhatsApp Number" />
      <input type="email" id="email" placeholder="Gmail" />
      <input type="password" id="password" placeholder="Create Password" />
      <button onclick="signUp()">Create Account</button>
    </div>

  </div>

  <!-- RIGHT IMAGE -->
  <div class="auth-right">
   <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80">

  </div>

</div>

  <div id="message" class="hidden"></div>


<!-- Search Page -->
<div class="container hidden" id="searchPage">
  <div class="header">
    <div class="logo">
      <h1><i class="fas fa-home"></i> FlatDekho</h1>
      <p>Find a flat buddy, split the rent</p>
    </div>
    <div class="madeby">Made by Shashank Tiwari</div>
  </div>

  <nav style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <div></div>
    <div>
      <button onclick="showWatchlist()" style="width:auto;padding:8px 12px;margin-right:10px;"><i class="fas fa-star"></i> Watchlist</button>
      <button onclick="logout()" style="width:auto;padding:8px 12px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <h2><i class="fas fa-search"></i> Search Flats</h2>
  <p>Welcome: <span id="userName"></span></p>
  <input type="text" id="location" placeholder="Location (e.g., Alpha 1)" />
  <button onclick="searchFlats()" id="searchBtn">Search</button>

  <div id="result"></div>

  <div id="watchlist" class="hidden">
    <h3>Your Watchlist (Flats You're Interested In)</h3>
    <div id="watchlistContent"></div>
  </div>
</div>

<script>
const flatsData = {
  "Alpha 1":[
    {id:1,type:"1BHK",price:5000,description:"Cozy 1BHK flat near market",image:"https://paramountgroup.co.in/upload/412b21794fe05956f7de1182026a19e9.jpg"},
    {id:2,type:"2BHK",price:8000,description:"Spacious 2BHK flat with balcony",image:"https://images.nobroker.in/images/8a9f8803910d2f4001910d74e41b273e/8a9f8803910d2f4001910d74e41b273e_51108_579351_medium.jpg"},
    {id:3,type:"1BHK",price:5500,description:"Modern 1BHK with gym access",image:"https://th.bing.com/th/id/R.53b99d369125e3befc97d14ce8970838?rik=2wxGXPYOXW%2bgqg&riu=http%3a%2f%2fwww.parasnoida.in%2fblogs%2fwp-content%2fuploads%2f2022%2f09%2f1.jpg&ehk=EpF2Vi%2bn6NkieyTkrl4xj7KRhcgKrg1WXdMp8OWYY9c%3d&risl=&pid=ImgRaw&r=0"}
  ]
};

function showMessage(text,type){
  const msg=document.getElementById('message');
  msg.className=type==='error'?'error-message':'success-message';
  msg.innerText=text;
  msg.classList.remove('hidden');
  setTimeout(()=>msg.classList.add('hidden'),3000);
}





function searchFlats(){
  const loc=document.getElementById('location').value.trim().toLowerCase();
  const resultDiv=document.getElementById('result');
  resultDiv.innerHTML='';
  document.getElementById('watchlist').classList.add('hidden');

  if(loc==='alpha 1'){
    flatsData["Alpha 1"].forEach(flat=>{
      const card=document.createElement('div'); card.className='flat-card';
      card.innerHTML=`
        <img src="${flat.image}" alt="${flat.type}" />
        <h3>${flat.type} - ₹${flat.price}/month</h3>
        <p>${flat.description}</p>
        <button onclick="addInterest(${flat.id})">Express Interest</button>
      `;
      const interests=getInterests();
      if(interests[flat.id] && interests[flat.id].length>0){
        const div=document.createElement('div'); div.className='interested-users';
        div.innerHTML='<strong>Interested Users:</strong>';
        interests[flat.id].forEach(u=>{
          div.innerHTML+=`<p>${u.name} - <a href="https://wa.me/${u.phone}" target="_blank">WhatsApp</a></p>`;
        });
        card.appendChild(div);
      }
      resultDiv.appendChild(card);
    });
  }else{ resultDiv.innerHTML="<p>No flats found. Try 'Alpha 1'</p>"; }
}

function addInterest(flatId){
  const name=localStorage.getItem('userName'); const phone=localStorage.getItem('userPhone');
  if(!name||!phone){alert("Login first");return;}
  const interests=getInterests();
  if(!interests[flatId]) interests[flatId]=[];
  if(interests[flatId].some(u=>u.phone===phone)){showMessage("Already expressed interest","error");return;}
  interests[flatId].push({name,phone}); localStorage.setItem('interests',JSON.stringify(interests));
  showMessage("Interest added","success"); searchFlats();
}

function getInterests(){ return localStorage.getItem('interests')?JSON.parse(localStorage.getItem('interests')):{} }

function showWatchlist(){
  const content=document.getElementById('watchlistContent'); content.innerHTML='';
  document.getElementById('result').innerHTML='';
  document.getElementById('watchlist').classList.remove('hidden');
  const phone=localStorage.getItem('userPhone'); const interests=getInterests();
  let has=false;
  for(const fid in interests){
    if(interests[fid].some(u=>u.phone===phone)){
      has=true;
      const flat=flatsData["Alpha 1"].find(f=>f.id==fid);
      if(flat){
        const card=document.createElement('div'); card.className='flat-card';
        card.innerHTML=`
          <img src="${flat.image}" alt="${flat.type}" />
          <h3>${flat.type} - ₹${flat.price}/month</h3>
          <p>${flat.description}</p>
          <p>You are interested in this flat.</p>
        `;
        content.appendChild(card);
      }
    }
  }
  if(!has) content.innerHTML="<p>You have not expressed interest in any flats yet.</p>";
}

function logout() {
  auth.signOut().then(() => {
    localStorage.clear();  // Extra info clear
    location.reload();     // Login page wapas show
  }).catch((error) => {
    alert(error.message);
  });
}



</script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAee6rfxqMkItbkoypdtuKPoeO7Ps8R1vw",
  authDomain: "flatdekhoo-93711.firebaseapp.com",
  projectId: "flatdekhoo-93711",
  storageBucket: "flatdekhoo-93711.firebasestorage.app",
  messagingSenderId: "913473111932",
  appId: "1:913473111932:web:08c413b4baa15c851286f9",
  measurementId: "G-49HSRF59D0"
};

// 🔹 Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔹 AUTH STATE FIX (VERY IMPORTANT)
auth.onAuthStateChanged((user) => {
  if (user) {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('searchPage').classList.remove('hidden');
    document.getElementById('userName').innerText =
      localStorage.getItem("userName") || "User";
  } else {
    document.getElementById('searchPage').classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
  }
});
</script>
  
<script>
function clearInputs(){
  document.querySelectorAll(
    "#signinForm input, #signupForm input"
  ).forEach(input => input.value = "");
}

  
  // 🔹 Tab Switching
function showSignIn(){
  document.getElementById('signinForm').classList.remove('hidden');
  document.getElementById('signupForm').classList.add('hidden');
  document.getElementById('signInTab').classList.add('active');
  document.getElementById('signUpTab').classList.remove('active');
}

function showSignUp(){
  clearInputs(); // 🔥 ADD THIS
  document.getElementById('signinForm').classList.add('hidden');
  document.getElementById('signupForm').classList.remove('hidden');
  document.getElementById('signUpTab').classList.add('active');
  document.getElementById('signInTab').classList.remove('active');
}


// 🔹 Sign Up
function signUp(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if(!name || !phone || !email || !password){
    alert("All fields are required");
    return;
  }

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => {
      // 🔥 Save locally (NO Firestore)
      localStorage.setItem("userName", name);
      localStorage.setItem("userPhone", phone);
      localStorage.setItem("userEmail", email);

      alert("Account created successfully. Please Sign In.");
      showSignIn();
    })
    .catch((error) => {
      if(error.code === "auth/email-already-in-use"){
        alert("Account already exists. Please Sign In.");
        showSignIn();
      } else {
        alert(error.message);
      }
    });
}


// 🔹 Sign In
function signIn(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();

  if(!email || !password){
    alert("Email and password required");
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('searchPage').classList.remove('hidden');
      document.getElementById('userName').innerText =
        localStorage.getItem("userName");
    })
    .catch((error) => {
      alert(error.message);
    });
}


</script>
  <script>

   function forgotPassword(){
  const email = document.getElementById('loginEmail').value.trim();

  if(!email){
    alert("Please enter your Gmail first");
    return;
  }

  auth.sendPasswordResetEmail(email)
    .then(() => {
      alert("Password reset email sent. Check your inbox.");
    })
    .catch((error) => {
      alert(error.message);
    });
}
 
    
  </script>
</body>
</html>
